<section class="section section-lg pt-lg-0 section-contact-us" id="CONTACT_SEC">
  <div class="container">
    <div class="row justify-content-center mt--300">
      <div class="col-lg-8">
        <div class="card bg-gradient-secondary shadow">
          <div class="card-body p-lg-5">
            <h4 class="mb-1">Do you want to get something done ?</h4>
            <p class="mt-0">Just drop me a messege and I'll contact you right away.</p>
            <form [formGroup]="FormData" (ngSubmit)="onSubmit(FormData.value)">
              <div class="form-group mt-5" [ngClass]="{'focused':focus===true}">
                <div class="input-group input-group-alternative">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="ni ni-user-run"></i></span>
                  </div>
                  <input class="form-control" placeholder="Your name" type="text" (focus)="focus=true" (blur)="focus=false" formControlName="Fullname">
                </div>
              </div>
              <div class="form-group" [ngClass]="{'focused':focus1===true}">
                <div class="input-group input-group-alternative">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="ni ni-email-83"></i></span>
                  </div>
                  <input class="form-control" placeholder="Email address" type="email" (focus)="focus1=true" (blur)="focus1=false" formControlName="Email">
                </div>
              </div>
              <div class="form-group mb-4">
                <textarea class="form-control form-control-alternative" name="name" rows="4" cols="80" placeholder="Type a message..." formControlName="Comment"></textarea>
              </div>

              <div *ngIf="alertmsg" class="form-group">
                <div class="alert" [ngClass]="{'alert-success': alertType === 'success', 'alert-danger' : alertType === 'danger'}"

                role="alert">
                  {{alertmsg}}
                </div>
              </div>

              <div>
                <button type="submit" class="btn btn-default btn-round btn-block btn-lg" [disabled]="!FormData.valid">Send Message</button>
              </div>
            </form>
            
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
